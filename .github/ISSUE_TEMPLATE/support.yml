name: Wardflame support
description: Report a game problem or ask for help
title: "[Support] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Wardflame issue. Do not include payment-card details, private save files, or other sensitive information.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gameplay
        - Controls or interface
        - Performance or crash
        - Purchase or restoration
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. iPhone 16 Pro or iPad Air
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: iOS or iPadOS version
      placeholder: e.g. iOS 18.6
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wardflame version
      placeholder: Version shown in the app
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Explain what you did, what happened, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Tap...
        3. See...
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included payment details or other sensitive information.
          required: true
